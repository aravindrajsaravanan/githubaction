name: 14 - Secrets & Variables
on: workflow_dispatch
jobs:
  explore-secrets-variables:
    runs-on: ubuntu-latest
    steps:
      - name: Show secrets
        env:
          api_key: ${{ secrets.DUMMY_API_KEY }}
        run: |
          if [ -z "$api_key" ]; then
            echo "API Key is not set"
          fi
            echo "API Key is set, github masks the secret value in the logs"
      - name: show variables
        env:
          linkedin_id: ${{ vars.LINKEDIN }}
        run: |
          if [ -z "$linkedin_id" ]; then
            echo "LinkedIn ID is not set"
          fi
            echo "LinkedIn ID is set, github prints the variable value in the logs"
