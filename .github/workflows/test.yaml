name: 12-env-workflow-job-step-level
on:
  workflow_dispatch
env:
  name: "aravind"
jobs:
  job-level:
    runs-on: ubuntu-latest
    env:
      name: "raj"
    steps:
    - name: print the env variable
      run: echo "Hello $name"
  workflow-level:
    runs-on: ubuntu-latest
    steps:
    - name: print the env variable
      run: echo "Hello $name"
  step-level:
    runs-on: ubuntu-latest
    steps:
    - name: print the env variable
      env:
        description: "is a devops engineer"
      run: echo "Hello ${name} and $description"
