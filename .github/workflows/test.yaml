name: 11-env-workflow-job-level
on:
  workflow_dispatch
env:
  name: "raj"
jobs:
  job-level:
    runs-on: ubuntu-latest
    env:
      name: "aravind"
    steps:
    - name: print the env variable
      run: echo "Hello $name"
  workflow-level:
    runs-on: ubuntu-latest
    steps:
    - name: print the env variable
      run: echo "Hello $name"
