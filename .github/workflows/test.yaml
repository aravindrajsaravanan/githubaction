name: 13 - Contexts
on: workflow_dispatch
jobs:
  explore-contexts:
    runs-on: ubuntu-latest
    steps:
      - name: Common github context values
        run: |
          echo "Repository : ${{ github.repository }}"
          echo "Actor      : ${{ github.actor }}"
          echo "Event      : ${{ github.event_name }}"
          echo "Ref name   : ${{ github.ref_name }}"
          echo "SHA        : ${{ github.sha }}"
          echo "Run number : ${{ github.run_number }}"  # increments each run
          echo "Workspace  : ${{ github.workspace }}"
          echo "Attempts   : ${{ github.run_attempt }}"

      - name: Runner context
        run: |
          echo "Runner OS  : ${{ runner.os }}"
          echo "Runner arch: ${{ runner.arch }}"

      # Dump the ENTIRE GitHub context as JSON - great for debugging/learning
      - name: Dump full github context
        env:
          GITHUB_DATA: ${{ toJSON(github) }}
        run: echo "$GITHUB_DATA"

      - name: Dump full runner context
        env:
          RUNNER_DATA: ${{ toJSON(runner) }}
        run: echo "$RUNNER_DATA"
