name: 15 - Needs dependencies
on: workflow_dispatch
jobs:
  build_job:
    runs-on: ubuntu-latest
    steps:
    - name: Build step
      run: |
        echo "Building the project..."
        sleep 5
  test_job:
    runs-on: ubuntu-latest
    needs: build_job
    steps:
    - name: Test step
      run: |
        echo "Running tests..."
        sleep 10
  lint_job:
    runs-on: ubuntu-latest
    needs: build_job
    steps:
    - name: Lint step
      run: |
        echo "Linting the code..."
        sleep 3
  deploy_job:
    runs-on: ubuntu-latest
    needs: [test_job, lint_job]
    steps:
    - name: Deploy step
      run: |
        echo "Deploying the application..."
